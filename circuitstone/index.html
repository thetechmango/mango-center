<!doctype html>
<html>

<head>
    <title>CircuitStone</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
        }

        #canvas {
            background-color: #000;
            border: 2px solid #114411;
            border-radius: 5px;

            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%);

            height: 80vh;
            width: auto;

            cursor: url('dot.png') 1 1, auto;
        }

        #toolbar {
            position: fixed;   
            width: 97vw;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            flex-flow: row wrap;
            justify-content: flex-start;
            gap: 10px;
            border: 2px solid #114411;
            color: white;
            font-family: sans-serif;
            align-items: center;
        }

        .tool {
            background: #444;
            color: white;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        .tool.active {
            background: #108010;
            font-weight: bold;
        }

        .action-btn {
            background: #333;
            color: #eee;
            border: 2px solid #114411;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        .action-btn:hover {
            background: #444;
        }

        .action-btn:active {
            background: #222;
        }

        #pause-btn.paused {
            background: #108010;
            border-color: #20a020;
        }

        .info { font-size: 12px; color: #aaa; margin-left: 10px; }

    </style>
</head>

<body>
    <div id="toolbar">
        <select id="wire-color" class="action-btn" title="Red, green, and blue wires do not interfere. White wires connect all wire types. Insulated wires do not power or get powered by components, and only connects to white wires. Also determines the color of power blocks and lamps. Power blocks follow the same general logic.">
            <option value="red">Red</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="white">White</option>
            <option value="black">Insulated</option>

        </select>        
        <button class="tool active" data-type="wire" title="Used to carry signals across distances.">Wire</button>
        <button class="tool" data-type="inverter" title="Inverts the signal. Equivalent to a NOT gate.">Inverter</button>
        <button class="tool" data-type="diode" title="Only lets the signal flow one way. Most of these components do this, but i made this anyway.">Diode</button>
        <button class="tool" data-type="bridge" title="Lets signals cross each other without interfering.">Bridge</button>
        <button class="tool" data-type="switch" title="Click to toggle this on or off.">Switch</button>
        <button class="tool" data-type="button" title="Hold click to keep the button on">Button</button>
        <button class="tool" data-type="powerBlock" title="Provides a constant signal. Can be different colors.">Power Block</button>
        <button class="tool" data-type="delay"  title="Delays the signal by a certain number of ticks.">Delay</button>
        <button class="tool" data-type="hoverSensor" title="Hover your cursor over this block to activate.">Hover Sensor</button>
        <button class="tool" data-type="lamp" title="Turns white when powered.">Lamp</button>
        <button class="tool" data-type="toggle" title="Toggles when activated by a signal. Equivalent to a T Flip Flop">Toggle</button>
        <button class="tool" data-type="keyBlock" title="Activates when a certain key is pressed. Click on it to bind the key.">Key Block</button>
        <button class="tool" data-type="transmitter" title="Transmits a signal onto a channel. Click to cycle channels. Shift+click to decrement.">Transmitter</button>
        <button class="tool" data-type="receiver" title="Activated when a transmitter activates a channel. Click to cycle channels. Shift+click to decrement.">Receiver</button>
        <button class="tool" data-type="random" title="Turns on or off randomly when activated.">Random</button>
        <button class="tool" data-type="trigger" title="Activates for one tick when the input turns on. Eequivalent to a rising edge detector.">Trigger</button>
        <button class="tool" data-type="noteBlock" title="Plays a set note when activated">Note Block</button>
        <button class="tool" data-type="rotator" title="Rotates the block in front of it in a toggleable direction.">Rotator</button>
        <button class="tool" data-type="actuator" title="Interacts with the block in front of it when powered. Green for a normal click and blue for a shift click.">Actuator</button>
        <button class="tool" data-type="repulsor" title="Pushes the block in front of it away upon activation.">Repulsor</button>
        <button class="tool" data-type="detector" title="Is powered when there is a block in front of it.">Detector</button>
        <button class="tool" data-type="duplicator" title="Copies the block behind it in front of it when activated.">Duplicator</button>
        <button class="tool" data-type="comment" title="Holds text that you can change with a click">Comment</button>
        <div class="info">Rotation: <span id="rot-display">Right</span></div>

        <button id="tickRateBtn" class="action-btn" onclick="changeTickRate()">Tick rate: 20</button>
        <button id="pause-btn" class="action-btn" onclick="togglePause()">Pause</button>
        <button class="action-btn" onclick="step()">Step</button>

        <div class="grid-controls">
            <span style="font-size: 12px; color: #888;">Grid Size:</span>
            <button class="action-btn" onclick="resizeGrid(gridWidth + 2, gridHeight + 1)">+</button>
            <button class="action-btn" onclick="resizeGrid(gridWidth - 2, gridHeight - 1)">-</button>
        </div>        

        <button class="action-btn" onclick="exportToJSON()">Export JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importFromJSON(event)">
        <button class="action-btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
    </div>
    <div id="selection-ui" style="display:none; position:fixed; z-index:100; pointer-events:none;">
        <button class="action-btn selection-btn" onclick="moveSelection()" style="pointer-events:auto;">✥ Move</button>
        <button class="action-btn selection-btn" onclick="copySelection()" style="pointer-events:auto;">⎘ Copy</button>
    </div>    
    <canvas id="canvas"></canvas>
    <script src="globals.js"></script>
    <script src="blocks.js"></script>
    <script src="index.js"></script>
</body>

</html>
