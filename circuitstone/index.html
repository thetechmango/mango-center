<!doctype html>
<html>

<head>
    <title>Circuitstone</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
        }

        #canvas {
            background-color: #000;
            border: 3px solid #104010;
            border-radius: 5px;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            height: 80vh;
            aspect-ratio: 2/1;
        }

        #toolbar {
            position: fixed;   
            width: 97vw;
            height: 40px;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            border: 2px solid #104010;
            color: white;
            font-family: sans-serif;
            align-items: center;
        }

        .tool {
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }

        .tool.active {
            background: #108010;
            font-weight: bold;
        }

        .action-btn {
            background: #333;
            color: #eee;
            border: 1px solid #555;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        .action-btn:hover {
            background: #444;
        }

        .action-btn:active {
            background: #222;
        }

        #pause-btn.paused {
            background: #108010;
            border-color: #20a020;
        }

        .info { font-size: 12px; color: #aaa; margin-left: 10px; }

    </style>
</head>

<body>
    <div id="toolbar">
        <select id="wire-color" class="action-btn">
            <option value="red">Red Wire</option>
            <option value="green">Green Wire</option>
            <option value="blue">Blue Wire</option>
            <option value="white">White Wire</option>
            <option value="black">Insulated Wire</option>

        </select>        
        <button class="tool active" data-type="wire">Wire</button>
        <button class="tool" data-type="inverter">Inverter</button>
        <button class="tool" data-type="diode">Diode</button>
        <button class="tool" data-type="bridge">Bridge</button>
        <button class="tool" data-type="switch">Switch</button>
        <button class="tool" data-type="button">Button</button>
        <button class="tool" data-type="delay">Delay</button>
        <button class="tool" data-type="hoverSensor">Hover Sensor</button>
        <button class="tool" data-type="lamp">Lamp</button>
        <button class="tool" data-type="toggle">Toggle</button>
        <button class="tool" data-type="keyBlock">Key Block</button>
        <div class="info">Rotation: <span id="rot-display">Right</span></div>

        <button id="pause-btn" class="action-btn" onclick="togglePause()">Pause</button>
        <button class="action-btn" onclick="step()">Step</button>

        <div class="grid-controls">
            <span style="font-size: 12px; color: #888;">Grid Size:</span>
            <button class="action-btn" onclick="resizeGrid(gridWidth + 2, gridHeight + 1)">+</button>
            <button class="action-btn" onclick="resizeGrid(gridWidth - 2, gridHeight - 1)">-</button>
        </div>        

        <button onclick="exportToJSON()">Export JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importFromJSON(event)">
        <button onclick="document.getElementById('importFile').click()">Import JSON</button>
    </div>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
</body>

</html>
