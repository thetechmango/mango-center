<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Mango Grid</title>
    <link rel="icon" type="image/x-icon" href="mango-grid-logo.png">
    <link rel="apple-touch-icon" href="mango-grid-logo.png">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            line-height: 24px;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }
        button {
            cursor: pointer;
        }
        #topLeftUI {
            position: absolute;
            top: 0;
            left: 0;
            max-width: 50vw;

            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 0;
            padding: 10px;
            z-index: 999;
        }
        #topRightUI {
            position: absolute;
            top: 0;
            right: 0;
            max-width: 100vw;
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 0;
            padding: 10px;
            z-index: 99;
        }
        #bottomLeftUI {
            position: absolute;
            bottom: 0;
            left: 0;
            max-width: 100vw;
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 0;
            padding: 10px;
            z-index: 99;
        }
        #palette {
            display: flex;
            flex-flow: row wrap;
            gap: 5px;
            padding: 5px;
            background-color: #444;
            border: none;
            border-radius: 10px;
        }
        #palette button {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 5px;
            transition: 0.2s ease;
        }
        #palette button.selected {
            transform: scale(0.6);
            border-radius: 50%;
        }
        #exportBtn {
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            margin: 0;
        }
        #cooldown {
            margin: 0;
            padding: 5px;
            background-color: #444;
            border-radius: 10px; 
            color: #fff;
        }
        #coords {
            margin: 0;
            padding: 5px;
            background-color: #444;
            border-radius: 10px; 
            color: #fff;
        }
        #onlineCount {
            padding: 5px;
            background-color: #444;
            border-radius: 10px; 
            color: #fff;
            z-index: 999;
        }
        #connectionStatus {
            border: none;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 14px;
            cursor: default;
        }

        #connectionStatus.connected {
            background: #009000;
            color: white;
        }

        #connectionStatus.connecting {
            background: #a08000;
            color: white;
        }

        #connectionStatus.disconnected {
            background: #900000;
            color: white;
            cursor: pointer;
        }
        #adminPanel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 999;
            background: #444;
            padding: 6px;
            border-radius: 6px;
        }
        #adminPanel input {
            width: 120px;
        }
        #loader {
            position: absolute;
            inset: 0;
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: sans-serif;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #555;
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        #zoom-btns {
            display: none;

            position: fixed;
            top: 50%;
            right: 5px;
            transform: translateY(-50%);

            flex-direction: column;
            gap: 2px;

            background-color: #444;
            padding: 2px;
            border-radius: 999px;
            z-index: 999;
            touch-action: none;
        }

        #chatBubbles {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .chatBubble {
            position: absolute;
            transform: translate(-50%, -100%);
            max-width: 250px;

            padding: 5px 8px;

            background: #444B;
            color: white;
            border-radius: 8px;

            font-size: 14px;
            line-height: 18px;

            overflow-wrap: anywhere;

            animation: chatFloat 4s ease-out forwards;
        }

        #chatInput {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: none;
            z-index: 999;

            width: min(500px, calc(100vw - 40px));
        }

        #chatText {
            box-sizing: border-box;
            width: 100%;

            padding: 10px 14px;

            border: none;
            border-radius: 10px;

            background: #444;
            color: white;

            font: inherit;
            outline: none;
        }

        #chatText::placeholder {
            color: #bbb;
        }

        #adminMessages {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
            max-width: 350px;
        }

        .adminMessage {
            background: #444B;
            color: rgb(147, 255, 117);
            padding: 10px 14px;
            border-radius: 10px;
            animation: adminMessageFade 15s ease forwards;
        }

        @keyframes adminMessageFade {
            0%, 85% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes chatFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, -80%);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, -100%);
            }

            90% {
                opacity: 1;
                transform: translate(-50%, -100%);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -160%);
            }
        }

        #zoom-btns button {
            width: 40px;
            height: 40px;

            padding: 0;

            display: flex;
            align-items: center;        /* vertical center */
            justify-content: center;    /* horizontal center */

            background: none;
            border: none;
            border-radius: 50%;

            background-color: #555;
            color: white;
            font-size: 18px;

            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media (pointer: coarse) {
            #zoom-btns {
                display: flex;
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="topLeftUI">
        <div id="palette"></div>
        <button id="exportBtn">Export Grid</button>
    </div>

    <div id="topRightUI">
        <p id="coords">(-, -)</p>
        <p id="cooldown">Cooldown: 5s</p>
    </div>

    <div id="bottomLeftUI">
        <div id="onlineCount">Online: 1</div>
        <button id="connectionStatus">Connecting...</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        Loading grid...
    </div>

    <div id="adminPanel">
        <input id="adminCode" type="password" placeholder="admin code">
        <button id="authBtn">Auth</button>
    </div>

    <div id="zoom-btns">
        <button id="zoomInBtn">+</button>
        <button id="zoomOutBtn">-</button>
    </div>

    <div id="adminMessages"></div>
    <div id="chatInput">
        <input id="chatText" type="text" maxlength="200" placeholder="Chat...">
    </div>
    <div id="chatBubbles"></div>
    <canvas id="canvas" width="1024" height="1024"></canvas>
    <script src="main.js"></script>
</body>

</html>
