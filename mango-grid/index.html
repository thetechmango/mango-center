<!DOCTYPE html>
<html>
<head>
    <title>Mango Grid</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            line-height: 24px;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        button {
            cursor: pointer;
        }
        #topLeftUI {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 0;
            padding: 10px;
            z-index: 999;
        }
        #topRightUI {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 0;
            padding: 10px;
            z-index: 999;
        }
        #palette {
            display: flex;
            gap: 5px;
            padding: 5px;
            background-color: #444;
            border: none;
            border-radius: 10px;
        }
        #palette button {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 5px;
            transition: 0.2s ease;
        }
        #palette button.selected {
            transform: scale(0.6);
            border-radius: 50%;
        }
        #exportBtn {
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px;
            margin: 0;
        }
        #cooldown {
            margin: 0;
            padding: 5px;
            background-color: #444;
            border-radius: 10px; 
            color: #fff;
            z-index: 999;
        }
        #coords {
            margin: 0;
            padding: 5px;
            background-color: #444;
            border-radius: 10px; 
            color: #fff;
            z-index: 999;
        }
        #onlineCount {
            position: absolute;
            bottom: 10px;;
            left: 10px;
            padding: 5px;
            margin: 0;
            background-color: #444;
            border-radius: 5px; 
            color: #fff;
            z-index: 999;
        }
        #adminPanel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 999;
            background: #444;
            padding: 6px;
            border-radius: 6px;
        }
        #adminPanel input {
            width: 120px;
        }
        #loader {
            position: absolute;
            inset: 0;
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #555;
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="topLeftUI">
        <div id="palette"></div>
        <button id="exportBtn">Export Grid</button>
    </div>
    <div id="topRightUI">
        <p id="coords">(-, -)</p>
        <p id="cooldown">Cooldown: 5s</p>
    </div>
    <div id="onlineCount">Online: 1</div>
    <div id="loader">
        <div class="spinner"></div>
        Loading grid...
        </div>
    <div id="adminPanel">
        <input id="adminCode" type="password" placeholder="admin code">
        <button id="authBtn">Auth</button>
    </div>
    <canvas id="canvas" width="1024" height="1024"></canvas>

    <script src="main.js"></script>
</body>

</html>
