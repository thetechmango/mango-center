<!DOCTYPE html>
<html>
<head>
    <title>Mango Grid</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #palette {
            position: absolute;
            display: flex;
            gap: 5px;
            z-index: 999;
            top: 10px;
            left: 10px;
            background-color: #444;
            border: 5px solid #444;
            border-radius: 10px;
        }
        #palette button {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 5px; 
        }
        #cooldown {
            position: absolute;
            top: 10px;;
            right: 10px;
            padding: 5px;
            margin: 0;
            background-color: #444;
            border-radius: 5px; 
            color: #fff;
            z-index: 999;
        }
        #onlineCount {
            position: absolute;
            bottom: 10px;;
            left: 10px;
            padding: 5px;
            margin: 0;
            background-color: #444;
            border-radius: 5px; 
            color: #fff;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="palette"></div>
    <p id="cooldown">Cooldown: 5s</p>
    <div id="onlineCount">Online: 1</div>
    <canvas id="canvas" width="256" height="256"></canvas>

    <script src="main.js"></script>
</body>

</html>
