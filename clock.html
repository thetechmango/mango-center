<!DOCTYPE html>
<html>
    <head>
       <title id="title"></title>
        <link rel="icon" type="image/png" href="images/mango-32.png">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;

                transition: background-color 0.4s ease; 
                font-family: 'Inter', sans-serif;
            }
            #clock {
                text-align: center;
                font-size: 128px;
                margin: auto;
            }
            
            .switch {
                position: absolute;
                top: 10px;
                right: 10px;
                display: inline-block;
                width: 60px;
                height: 34px;
            }
            
            /* Hide default HTML checkbox */
            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }
            
            .slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #ccc;
                -webkit-transition: .4s;
                transition: .4s;
            }
            
            .slider:before {
                position: absolute;
                content: "";
                height: 26px;
                width: 26px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                -webkit-transition: .4s;
                transition: .4s;
            }
            
            input:checked + .slider {
                background-color: rgb(77, 175, 255);
            }
            
            input:focus + .slider {
                box-shadow: 0 0 1px rgb(77, 175, 255);
            }
            
            input:checked + .slider:before {
                -webkit-transform: translateX(26px);
                -ms-transform: translateX(26px);
                transform: translateX(26px);
            }
            
            /* Rounded sliders */
            .slider.round {
                border-radius: 34px;
            }
            
            .slider.round:before {
                border-radius: 50%;
            }
        </style>
</head>
<body>
    <label class="switch">
      <input id="darkModeCheckbox" type="checkbox">
      <span class="slider round"></span>
    </label>
    <div id="container">
    <h1 id="clock"></h1>
    </div>
<script>
        const darkCheckbox = document.getElementById('darkModeCheckbox');
        const clock = document.getElementById('clock');

        // 1. Check for saved preference on load
        const isDarkMode = localStorage.getItem('darkMode') === 'enabled';

        // 2. Apply saved state immediately
        if (isDarkMode) {
            darkCheckbox.checked = true;
            applyDarkMode(true);
        }

        darkCheckbox.addEventListener('change', function () {
            if (darkCheckbox.checked) {
                applyDarkMode(true);
                localStorage.setItem('darkMode', 'enabled'); // Save preference
            } else {
                applyDarkMode(false);
                localStorage.setItem('darkMode', 'disabled'); // Save preference
            }
        });

        // Helper function to handle the visual changes
        function applyDarkMode(isDark) {
            document.body.style.backgroundColor = isDark ? "black" : "white";
            clock.style.color = isDark ? "white" : "black";
        }

        let militaryTime = false;
        function startTime() {
            const today = new Date();
            let h = today.getHours();
            let m = today.getMinutes();
            let s = today.getSeconds();

            if (!militaryTime) {
                if (h === 0) h = 12;
                else if (h > 12) h -= 12;
            }

            m = checkTime(m);
            s = checkTime(s);

            const timeString = h + ":" + m + ":" + s;
            clock.innerHTML = timeString;
            document.getElementById('title').innerHTML = timeString;
            setTimeout(startTime, 1000);
        }

        function checkTime(i) {
            if (i < 10) { i = "0" + i };
            return i;
        }

        startTime();

</script>
</body>
</html>
